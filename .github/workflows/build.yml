name: Build GALERY HUTANG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          # If the Android project is already extracted, use it.
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -not -path '*/.gradle/*' \
            -not -path './_android_project/*' -print -quit)"

          # Otherwise extract the project ZIP stored in the repository.
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Tidak ditemukan proyek Android maupun file ZIP proyek."
              find . -maxdepth 4 -type f -print | sort | head -200
              exit 1
            fi

            echo "ZIP proyek ditemukan: $ZIP_FILE"
            mkdir -p _android_project
            unzip -o "$ZIP_FILE" -d _android_project

            SETTINGS_FILE="$(find _android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \
              \) -not -path '*/.gradle/*' -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::ZIP berhasil diproses, tetapi settings.gradle tidak ditemukan."
            find _android_project -maxdepth 6 -type f -print | sort | head -250
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek Android siap di: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALERY-HUTANG-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
