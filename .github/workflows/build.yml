name: Build GALERY HUTANG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project folder
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/.gradle/*" -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/.gradle/*" -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle tidak ditemukan. Pastikan file proyek Android sudah diekstrak ke repository."
            echo "Daftar file repository:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek Android ditemukan di: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALERY-HUTANG-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
